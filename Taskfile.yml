version: "3"

# Canonical entry points. Run inside the dev shell (direnv/`nix develop`),
# which sets LD_LIBRARY_PATH so the numpy/OCP manylinux wheels can load.

tasks:
  viewer:
    desc: Start the OCP CAD Viewer in standalone (browser) mode on port 3939.
    summary: |
      Runs `python -m ocp_vscode` WITHOUT --backend, which serves the
      three-cad-viewer at http://127.0.0.1:3939, then opens it in Firefox
      (a new tab in the existing window). Leave this running, then run
      `task build` in another shell.
    cmds:
      - |
        # Once the server is listening on 3939, open it in the existing
        # Firefox window (new tab), then keep the server in the foreground.
        if command -v firefox >/dev/null 2>&1; then
          (
            i=0
            while [ "$i" -lt 50 ]; do
              if python -c "import socket,sys; sys.exit(0 if socket.socket().connect_ex(('127.0.0.1', 3939)) == 0 else 1)" 2>/dev/null; then
                firefox http://localhost:3939 >/dev/null 2>&1 &
                break
              fi
              i=$((i + 1))
              sleep 0.2
            done
          ) &
        fi
        exec python -m ocp_vscode --port 3939

  build:
    desc: Build the main wave case (duality_wave.cli.build) and export STEP files to build/step.
    summary: |
      Runs the primary case generator. With `task viewer` running in another
      shell, geometry is also pushed to the browser viewer.
    cmds:
      - python -m duality_wave.cli.build

  compact:
    desc: Build the compact case variant (duality_wave.cli.compact) and export STEP files to build/step.
    cmds:
      - python -m duality_wave.cli.compact

  coupons:
    desc: Export the fit calibration coupons (duality_wave.coupons) as one print plate.
    summary: |
      Writes build/coupons.stl with a switch plate, a plate-in-cavity fit test, heat-set
      insert pilots, pockets for the XIAO and the battery, and magnet pockets with
      different skins and a mate to feel the pull. Print it
      with the settings of the final case, then update the PrintProfile.
      With `task viewer` running, the coupons also show up in the browser.
    cmds:
      - python -m duality_wave.coupons

  coupons-engraving:
    desc: Export the coupons for the wall emblems (duality_wave.coupons_engraving) as one print plate.
    summary: |
      Writes build/coupons_engraving.stl with four wall slabs, one for each combination of
      pocket depth (1 and 2 lines) and roof (sloped and straight). Each slab carries three space
      invaders with different pixel gaps and the symbol. Print it with the settings of the final
      case, then update engraving_lines, engraving_roof_slope and engraving_pitch in the PrintProfile.
      With `task viewer` running, the coupons also show up in the browser.
    cmds:
      - python -m duality_wave.coupons_engraving

  layout:
    desc: Regenerate ergogen/*.points.yaml from ergogen/*.yml with ergogen.
    summary: |
      Run this after you change a layout file. Commit the points files.
      tests/test_layout.py fails when a points file is out of date.
    cmds:
      - for: [wave, compact]
        cmd: ergogen ergogen/{{.ITEM}}.yml -o build/ergogen/{{.ITEM}} && cp build/ergogen/{{.ITEM}}/points/points.yaml ergogen/{{.ITEM}}.points.yaml

  check:
    desc: Fast checks. Verifies uv.lock, lints, and runs the fast tests (no case is built).
    cmds:
      - uv lock --check
      - ruff check .
      - pytest -q -m "not integration and not perf"

  update:
    desc: Upgrade all Python packages in uv.lock, then install them.
    summary: |
      The dev shell installs the locked versions only (uv sync --frozen).
      Run this task on purpose when you want newer packages. Then run `task test`.
    cmds:
      - uv lock --upgrade
      - uv sync --frozen

  test:
    desc: Check the lock file and lint, run all tests in parallel, then the time limits alone (about 35 s).
    cmds:
      - uv lock --check
      - ruff check .
      - pytest -q -n auto --dist loadgroup -m "not perf"
      - pytest -q -m perf

  render:
    desc: Render the README images into docs/images.
    summary: |
      Exports the assembled case as meshes (duality_wave.cli.render) and renders them with
      Blender, which `nix shell` fetches on demand (scripts/render_blender.py).
    cmds:
      - python -m duality_wave.cli.render build/render
      - nix shell nixpkgs#blender --command blender -b -P scripts/render_blender.py -- build/render docs/images
