version: "3"

# Canonical entry points. Run inside the dev shell (direnv/`nix develop`),
# which sets LD_LIBRARY_PATH so the numpy/OCP manylinux wheels can load.

tasks:
  viewer:
    desc: Start the OCP CAD Viewer in standalone (browser) mode on port 3939.
    summary: |
      Runs `python -m ocp_viewer` WITHOUT --backend, which serves the
      three-cad-viewer at http://127.0.0.1:3939. 
      Leave this running, then run `task view` in another shell.
    cmds:
      - exec python -m ocp_viewer --port 3939

  view:
    desc: Show the case in a pose, or a coupon plate, in the viewer. Run `task view -- transport`.
    summary: |
      Builds the case and shows it in the viewer (duality_wave.cli view). It replaces what
      the viewer shows and writes no files. Run `task viewer` in another shell first.
      Arguments after `--`:
      - assembled (default), transport (right half flipped onto the left half) or
        exploded (left half, one layer after the other along Z)
      - coupons-hardware or coupons-plate-wiring-engraving: the calibration plates
      - --compact: the compact variant of the case
      - --ghost: make the keywell, keyplate and bottom see-through, so the parts inside stand out
      - --debug: also push the intermediate shapes in a hidden group (assembled only)
    cmds:
      - python -m duality_wave.cli view {{.CLI_ARGS}}
  
  watch:
    desc: Watch for changes in the source files and automatically run `view`.
    summary: |
      Monitors the source files for changes and triggers the `view` task.
    watch: true
    interval: '1000ms'
    sources: 
      - 'src/**'
      - 'ergogen/**'
    cmds:
      - task view

  export-case:
    desc: Write the STEP files of the case to build/case and print their paths.
    summary: |
      Writes files and shows nothing (duality_wave.cli export-case).
      Each file is in its print orientation. Add `-- --compact` for the compact variant.
      The symbol on the keywell and the invader on the bottom plate get their own file, in the same frame as their part: 01_keywell_left.step and 02_keywell_left_emblem.step.
    cmds:
      - python -m duality_wave.cli export-case {{.CLI_ARGS}}

  export-coupon:
    desc: Write the STL of every coupon plate to build/coupons and print their paths.
    summary: |
      Writes files and shows nothing (duality_wave.cli export-coupon):
      - build/coupons/coupons_hardware.stl: the first plate, for the switch cutouts, the insert pilots, the XIAO and battery pockets and the magnets.
      - build/coupons/coupons_plate_wiring_engraving.stl: the second plate, for the plate fit, the trenches, the diode pockets and the wall emblems.
      Print a coupon plate with the settings of the final case, then update the PrintProfile.
    cmds:
      - python -m duality_wave.cli export-coupon {{.CLI_ARGS}}

  layout:
    desc: Regenerate ergogen/*.points.yaml from ergogen/*.yml with ergogen.
    summary: |
      Run this after you change a layout file. Commit the points files.
      tests/test_layout.py fails when a points file is out of date.
    cmds:
      - for: [wave, compact]
        cmd: ergogen ergogen/{{.ITEM}}.yml -o build/ergogen/{{.ITEM}} && cp build/ergogen/{{.ITEM}}/points/points.yaml ergogen/{{.ITEM}}.points.yaml

  wiring-editor:
    desc: Edit ergogen/wave.wiring.yaml in the browser.
    summary: |
      Starts a server on 127.0.0.1:8765 and opens the visual wiring editor. It shows the checks live and writes the file on Save.
      Add `-- --port 9000`, `-- --no-browser` or `-- --file path.yaml` to change the defaults.
    cmds:
      - python scripts/wiring_editor.py {{.CLI_ARGS}}

  check:
    desc: Fast checks. Verifies uv.lock, lints, and runs the fast tests (no case is built).
    cmds:
      - uv lock --check
      - ruff check .
      - pytest -q -m "not integration and not perf"

  update:
    desc: Upgrade all Python packages in uv.lock, then install them.
    summary: |
      The dev shell installs the locked versions only (uv sync --frozen).
      Run this task on purpose when you want newer packages. Then run `task test`.
    cmds:
      - uv lock --upgrade
      - uv sync --frozen

  test:
    desc: Check the lock file and lint, run all tests in parallel, then the time limits alone (about 35 s).
    cmds:
      - uv lock --check
      - ruff check .
      - pytest -q -n auto --dist loadgroup -m "not perf"
      - pytest -q -m perf

  render:
    desc: Render the README images into docs/images.
    summary: |
      Exports the assembled, transport and exploded poses of the case as meshes
      (duality_wave.cli.render) and renders them with Blender, which `nix shell` fetches on
      demand (scripts/render_blender.py).
    cmds:
      - python -m duality_wave.cli render build/render
      - nix shell nixpkgs#blender --command blender -b -P scripts/render_blender.py -- build/render docs/images
