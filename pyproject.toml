[project]
name = "duality-wave"
version = "0.1.0"
# Pinned to match the flake's interpreter (Python 3.13); this keeps uv from
# grabbing an interpreter that lacks OCP wheels.
requires-python = ">=3.11,<3.14"
dependencies = [
  # Current build123d depends on cadquery-ocp-novtk + py-lib3mf, both of which
  # ship aarch64-linux wheels — so no dependency overrides are needed anymore.
  "build123d>=0.13",
  "numpy",
  # Python package for the standalone (browser) viewer: `python -m ocp_vscode`.
  "ocp_vscode",
  # layout.py reads the points that ergogen writes.
  "pyyaml",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duality_wave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10"
markers = [
    "integration: builds a whole case or the coupons. The fast tier skips these tests.",
    "perf: checks a wall-clock limit. It runs alone, because load changes the times.",
]

[tool.ruff]
line-length = 140
extend-exclude = [".direnv", "build"]

[tool.ruff.lint]
# Real errors only: syntax, undefined names, unused imports and variables.
# Star imports of build123d and `with BuildPart() as name` are the house style.
select = ["E4", "E7", "E9", "F"]
ignore = ["F403", "F405", "F841", "E741"]
