units:
  # cx and cy:  18.0mmx17.0mm for kailh choc
  kx: cx
  ky: cy
  # with padding
  px: kx + 1
  py: ky + 1

  # size of holes in switch plate - a bit larger to account for nylon p12 shrinkage
  sh: 14.05

  thumb_rotation: -8
  pinky_rotation: 8

points:
  key.width: sh
  key.height: sh
  key.padding: 1ky
  key.spread: 1kx
  zones:      
    matrix:
      columns:
        index.key.stagger: 0.25ky
        inner.key.stagger: -0.25ky
      rows:
        bottom:
    thumb:
      anchor:
        ref: matrix_inner_bottom
        shift: [-6.5, -18]
        rotate: -8
      columns:
        middle:
          key.origin: [-0.5U, -0.3U]
        reachy:
          key.origin: [-0.5U, -0.3U]

      
      
