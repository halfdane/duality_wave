# The wiring of the keyplate. Edit this file with `task wiring-editor`.
# The editor keeps this comment, and drops comments between the lines.
# The editor shows the checks live. tests/test_wiring.py checks the file too.
#
# All coordinates are in mm, in the frame of the blank (the left half). The builder mirrors the right keyplate.
# A trench is a list of vertices. A vertex is [x, y] or [x, y, r]. r is the radius of the corner. Without r the corner
# gets the largest radius up to 1.5 mm that fits. The first and the last vertex are sharp.
# The first and the last vertex of a trench lie on a terminal or on another trench of the same net.
# Every net ends in the channel.
# The contacts of the switches sit on the other side of the key in the right half, so each half has its own trenches.
# Notch: `side` is -1 for the -X side of the key and +1 for the other. `y` is the offset of the diode along the Y axis of the key (mm).
# A coordinate does not follow the layout. After a change of the layout, the editor shows which ends miss their terminals.

diode: {body_d: 2.0, body_l: 4.2, lead_d: 0.5}

# One wide recess in the underside of the keyplate, from two opposite corners.
# It starts at the inner column, runs along the top edge, and opens into the pocket of the XIAO. The wires of all nets lie in it.
